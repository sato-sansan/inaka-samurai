# GitHub Pages 公開（https://sato-sansan.github.io/inaka-samurai/）
# ソースは "/" 前提のまま（Vercel用）。Pages用ビルドのときだけ base を付け、
# 直書きの "/xxx" リンクを "/inaka-samurai/xxx" に書き換える。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx astro build --site https://sato-sansan.github.io --base /inaka-samurai
      - name: Rewrite root-relative links for project Pages
        run: |
          find dist -name '*.html' -print0 | xargs -0 perl -pi -e 's#((?:href|src|action)=")/(?!/|inaka-samurai/)#$1/inaka-samurai/#g'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
